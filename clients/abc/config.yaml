# ABC Inc — fictional assessment client. Source workbook is read-only and lives in data/.
client: abc
display_name: ABC Inc
workbook: ../../data/ABC Inc - Financial Statements.xlsx   # relative to this folder

sheets:
  income_statement: Income Statement
  balance_sheet: Balance Sheet          # not analyzed yet; used as evidence for fiscal_year below

layout:
  header_label: Account                 # B5
  month_format: "%b %Y"                 # C5:T5 = "Jun 2026" ... "Jan 2025" (newest first)

# canonical section -> header/total row labels in the sheet
sections:
  income:             {header: Income,             total: Total Income}              # A7, A14
  cost of goods sold: {header: Cost of Goods Sold, total: Total Cost of Goods Sold}  # A16, A24
  operating expenses: {header: Operating Expenses, total: Total Operating Expenses}  # A28, A103

totals:
  revenue: Total Income                       # row 14
  cost_of_goods_sold: Total Cost of Goods Sold  # row 24
  gross_profit: Gross Profit                  # row 26
  operating_expenses: Total Operating Expenses  # row 103 = SUM(details) + row 59 + row 71
  operating_income: Operating Income          # row 105
  net_income: Net Income                      # row 107

# Block headers / subtotals inside OPEX; excluded so their child rows are not double-counted.
subtotal_rows: [S & M Payroll, Total S & M Payroll, Marketing, Total Marketing]   # B47, B59, B60, B71

# Flag any month whose gross margin falls by more than this many percentage points vs the prior month.
thresholds:
  gross_margin_drop_pp: 5

fiscal_year:
  start_month: 1   # Evidence: Balance Sheet D63 Current Year Earnings (-1,987,916.44) = SUM Net Income Jan-Jun 2026; E63 = Jan-May 2026.

# Reporting categories for OPEX. Mapping is a first pass for reviewer approval.
categories:
  - Payroll & Benefits
  - Sales & Marketing
  - Professional Services
  - Technology
  - General & Administrative
  - Finance & Tax

